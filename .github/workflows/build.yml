name: Build XDE geodata

on:
  workflow_dispatch:

  schedule:
    - cron: "20 1 * * *"

permissions:
  contents: write

concurrency:
  group: xde-geodata-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install protobuf compiler
        run: |
          python -m pip install \
            "protobuf>=6,<7" \
            "grpcio-tools>=1.70,<2"

      - name: Generate protobuf bindings
        run: |
          python -m grpc_tools.protoc \
            -I proto \
            --python_out=scripts \
            proto/geodat.proto

      - name: Download upstream geodata
        run: |
          set -euo pipefail

          mkdir -p upstream dist

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --output upstream/loyalsoldier-geosite.dat \
            "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --output upstream/loyalsoldier-geoip.dat \
            "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --output upstream/roscom-geosite.dat \
            "https://github.com/hydraponique/roscomvpn-geosite/releases/latest/download/geosite.dat"

          test -s upstream/loyalsoldier-geosite.dat
          test -s upstream/loyalsoldier-geoip.dat
          test -s upstream/roscom-geosite.dat

      - name: Build hybrid geosite
        run: |
          set -euo pipefail

          python scripts/merge_geosite.py \
            --loyalsoldier upstream/loyalsoldier-geosite.dat \
            --roscom upstream/roscom-geosite.dat \
            --output dist/geosite.dat

      - name: Copy GeoIP
        run: |
          cp \
            upstream/loyalsoldier-geoip.dat \
            dist/geoip.dat

      - name: Generate checksums
        run: |
          set -euo pipefail

          cd dist

          sha256sum geosite.dat \
            > geosite.dat.sha256

          sha256sum geoip.dat \
            > geoip.dat.sha256

          ls -lh

          cat geosite.dat.sha256
          cat geoip.dat.sha256

      - name: Prepare release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf /tmp/xde-release
          mkdir -p /tmp/xde-release

          cp dist/geosite.dat \
            /tmp/xde-release/

          cp dist/geosite.dat.sha256 \
            /tmp/xde-release/

          cp dist/geoip.dat \
            /tmp/xde-release/

          cp dist/geoip.dat.sha256 \
            /tmp/xde-release/

          cp dist/manifest.json \
            /tmp/xde-release/

          cd /tmp/xde-release

          git init
          git config user.name \
            "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b release

          git add .
          git commit -m \
            "Update geodata $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git push \
            --force \
            origin \
            release

      - name: Purge jsDelivr cache
        continue-on-error: true
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@release/geosite.dat"

          curl \
            --fail \
            --silent \
            --show-error \
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@release/geosite.dat.sha256"

          curl \
            --fail \
            --silent \
            --show-error \
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@release/geoip.dat"

          curl \
            --fail \
            --silent \
            --show-error \
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@release/geoip.dat.sha256"